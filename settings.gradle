pluginManagement {
    repositories {

        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven {
            name = 'parchment'
            url = 'https://maven.parchmentmc.org'
        }
        maven {
            url = "https://maven.wagyourtail.xyz/releases"
        }
        maven {
            url = "https://maven.wagyourtail.xyz/snapshots"
        }
        gradlePluginPortal()
        mavenCentral()
    }
}
include 'tesseract-forge'
project(':tesseract-forge').setProjectDir(new File("GT-Lib/TesseractAPI/forge"))
include 'tesseract-common'
project(':tesseract-common').setProjectDir(new File("GT-Lib/TesseractAPI/common"))
include 'tesseract-fabric'
project(':tesseract-fabric').setProjectDir(new File("GT-Lib/TesseractAPI/fabric"))
include 'tesseract-graph'
project(':tesseract-graph').setProjectDir(new File("GT-Lib/TesseractAPI/graph"))
include("GT-Lib")

